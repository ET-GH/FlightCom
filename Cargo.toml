[package]
name = "mcu"
version = "0.1.0"
edition = "2024"

[dependencies]
# For labeling/handling of MCU resources.
assign-resources = "0.5.0"

# Core dependencies required for all Arm Cortex-M chips.
cortex-m = {
  version = "0.7.7",
  features = [
    "critical-section-single-core",
    "inline-asm",
  ]
}
cortex-m-rt = "0.7.5"

# Logging shit.
defmt = "1.1.1"
defmt-rtt = {
  version = "1.3.0",
  features = ["disable-blocking-mode"],
  optional = true
}

# Core async/await engine.
embassy-executor = {
  version = "0.10.0",
  features = [
    "defmt",
    "executor-thread",
    "platform-cortex-m",
  ]
}

# Enablement for our specific STM32 chip.
embassy-stm32 = {
  version = "0.6.0",
  features = [
    "defmt",  # Logging
    "exti",  # External interrupts
    "memory-x",  # Auto-generate memory-x file
    "stm32h562rg",  # Our MCU
    "time",  # Timekeeping
    "time-driver-tim2",  # 32-bit general purpose timer
  ]
}

# Synchronization primitives.
embassy-sync = "0.8.0"

# Timekeeping.
# Tick rate of 100KHz was chosen for ~3hz IRQ rollover and 10us timestamps.
embassy-time = { version = "0.5.1", features = ["defmt", "tick-hz-100_000"] }

# Floating point math in no_std.
libm = "0.2.16"

# Mafs, of the linear variety.
nalgebra = {
  version = "0.35.0",
  default-features = false,
  features = ["defmt", "libm"]
}

[features]
default = ["debug-logging"]
debug-logging = ["defmt-rtt"]  # Debug probe
local-logging = []  # NOR flash and LoRa

[profile.release]
lto = true
codegen-units = 1
